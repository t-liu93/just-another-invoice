<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>重置您的密码</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 0; background: #f5f5f5; }
    .container { max-width: 480px; margin: 40px auto; background: #fff; border-radius: 8px; padding: 32px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    h1 { font-size: 20px; margin: 0 0 16px; }
    p { font-size: 14px; line-height: 1.6; color: #333; }
    .button { display: inline-block; padding: 12px 24px; background: #18a058; color: #fff; text-decoration: none; border-radius: 6px; font-size: 14px; font-weight: 600; }
    .footer { margin-top: 24px; font-size: 12px; color: #999; }
  </style>
</head>
<body>
  <div class="container">
    <h1>重置您的密码</h1>
    <p>您请求重置 <strong>Just Another Invoice</strong> 账户的密码。</p>
    <p>点击下方按钮设置新密码。此链接将在 1 小时后失效。</p>
    <p><a class="button" href="{{ reset_url }}">重置密码</a></p>
    <p>如果按钮无法点击，请将以下链接复制到浏览器中打开：</p>
    <p style="word-break: break-all; font-size: 13px;">{{ reset_url }}</p>
    <div class="footer">
      <p>如果您没有发起此请求，可以安全地忽略此邮件。</p>
    </div>
  </div>
</body>
</html>
