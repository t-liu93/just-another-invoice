# Sample Nginx reverse-proxy config for Yet Another Ledger.
#
# This is a minimal starting point — replace every <PLACEHOLDER> below.
# The app container publishes only on the loopback interface
# (127.0.0.1:${APP_HOST_PORT:-8000}), so Nginx terminates TLS and proxies to it.
#
# Drop this into your Nginx sites (e.g. /etc/nginx/sites-available/),
# enable it, then: nginx -t && systemctl reload nginx

# Redirect all plain HTTP to HTTPS.
server {
    listen      80;
    listen      [::]:80;
    server_name <YOUR_DOMAIN>;            # e.g. invoice.example.com

    return 301 https://$host$request_uri;
}

server {
    listen      443 ssl;
    listen      [::]:443 ssl;
    http2       on;
    server_name <YOUR_DOMAIN>;            # e.g. invoice.example.com

    # --- TLS -----------------------------------------------------------------
    ssl_certificate     <PATH_TO_FULLCHAIN_PEM>;   # e.g. /etc/letsencrypt/live/<domain>/fullchain.pem
    ssl_certificate_key <PATH_TO_PRIVKEY_PEM>;     # e.g. /etc/letsencrypt/live/<domain>/privkey.pem

    # --- Upload size ---------------------------------------------------------
    # Receipts/invoices can be large scans. The app's own limit is 10 MB by
    # default (backend setting MAX_RECEIPT_BYTES); keep this at or above that,
    # with a little headroom, so the app returns the friendly error instead of
    # Nginx rejecting the request with 413. (Nginx default is only 1 MB.)
    client_max_body_size 16M;

    # --- Reverse proxy to the app -------------------------------------------
    location / {
        proxy_pass http://127.0.0.1:8000;          # match APP_HOST_PORT if you changed it

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;  # lets the app know it is behind HTTPS

        # AI receipt extraction calls an external model and can be slow.
        proxy_read_timeout 120s;
    }
}
